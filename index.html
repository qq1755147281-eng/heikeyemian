<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATRIX · 黑客终端</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Courier New', 'Consolas', monospace;
      background: #000;
      color: #00ff41;
      overflow-x: hidden;
    }

    /* 数字雨画布 */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.6;
    }

    /* 扫描线效果 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 30px 20px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 顶部标题 */
    .header {
      text-align: center;
      margin-bottom: 40px;
      margin-top: 20px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 40px #00ff41;
      letter-spacing: 8px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .header .subtitle {
      font-size: 12px;
      color: rgba(0, 255, 65, 0.6);
      margin-top: 8px;
      letter-spacing: 4px;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 40px #00ff41;
      }
      to {
        text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41, 0 0 60px #00ff41, 0 0 80px #00ff41;
      }
    }

    /* 状态信息栏 */
    .status-bar {
      width: 100%;
      max-width: 500px;
      border: 1px solid rgba(0, 255, 65, 0.3);
      padding: 12px 16px;
      margin-bottom: 30px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      background: rgba(0, 255, 65, 0.05);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff41;
      box-shadow: 0 0 8px #00ff41;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 按钮网格 */
    .hack-buttons {
      width: 100%;
      max-width: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 30px;
    }

    .hack-btn {
      position: relative;
      background: rgba(0, 255, 65, 0.08);
      border: 1px solid rgba(0, 255, 65, 0.4);
      color: #00ff41;
      padding: 20px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
      overflow: hidden;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      clip-path: polygon(
        12px 0,
        calc(100% - 12px) 0,
        100% 50%,
        calc(100% - 12px) 100%,
        12px 100%,
        0 50%
      );
      min-height: 95px;
      justify-content: center;
    }

    .hack-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .hack-btn:hover::before {
      left: 100%;
    }

    .hack-btn:hover {
      background: rgba(0, 255, 65, 0.2);
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.5), inset 0 0 20px rgba(0, 255, 65, 0.1);
      transform: translateY(-2px);
    }

    .hack-btn:active {
      transform: translateY(0);
    }

    .hack-btn .btn-icon {
      font-size: 28px;
      filter: drop-shadow(0 0 6px rgba(0, 255, 65, 0.5));
    }

    .hack-btn .btn-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .hack-btn .btn-label {
      display: block;
      font-size: 14px;
    }

    .hack-btn .btn-sub {
      display: block;
      font-size: 10px;
      color: rgba(0, 255, 65, 0.5);
      letter-spacing: 1.5px;
    }

    .hack-btn .btn-arrow {
      display: none;
    }

    /* 展开面板 */
    .panel {
      width: 100%;
      max-width: 500px;
      border: 1px solid #00ff41;
      background: rgba(0, 0, 0, 0.85);
      margin-bottom: 20px;
      display: none;
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
    }

    .panel.active {
      display: block;
      animation: panelOpen 0.4s ease-out;
    }

    @keyframes panelOpen {
      from {
        opacity: 0;
        transform: scaleY(0.8);
        transform-origin: top;
      }
      to {
        opacity: 1;
        transform: scaleY(1);
        transform-origin: top;
      }
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(0, 255, 65, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 255, 65, 0.1);
    }

    .panel-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .panel-close {
      background: none;
      border: none;
      color: #00ff41;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .panel-close:hover {
      opacity: 1;
    }

    .panel-body {
      padding: 16px;
      font-size: 12px;
      line-height: 1.8;
      max-height: 300px;
      overflow-y: auto;
    }

    /* 终端文字效果 */
    .terminal-text {
      color: #00ff41;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .terminal-text .line {
      display: block;
      animation: fadeLine 0.3s ease-out;
    }

    @keyframes fadeLine {
      from { opacity: 0; transform: translateX(-5px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .terminal-text .success { color: #00ff41; }
    .terminal-text .warning { color: #ffff00; }
    .terminal-text .danger { color: #ff4444; }
    .terminal-text .info { color: #00ccff; }
    .terminal-text .dim { color: rgba(0, 255, 65, 0.5); }

    /* 进度条 */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(0, 255, 65, 0.1);
      border: 1px solid rgba(0, 255, 65, 0.3);
      margin: 10px 0;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #00ff41;
      box-shadow: 0 0 10px #00ff41;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 底部导航栏 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: rgba(0, 0, 0, 0.85);
      border-top: 1px solid rgba(0, 255, 65, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 0 20px;
      z-index: 100;
      backdrop-filter: blur(15px);
    }

    /* 顶部发光线 */
    .bottom-nav::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #00ff41, transparent);
      box-shadow: 0 0 10px #00ff41;
    }

    .nav-btn {
      position: relative;
      width: 130px;
      height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(0, 255, 65, 0.05);
      border: 1px solid rgba(0, 255, 65, 0.3);
      color: rgba(0, 255, 65, 0.6);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 2px;
      clip-path: polygon(
        10px 0,
        calc(100% - 10px) 0,
        100% 10px,
        100% calc(100% - 10px),
        calc(100% - 10px) 100%,
        10px 100%,
        0 calc(100% - 10px),
        0 10px
      );
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.15), transparent);
      transition: left 0.5s ease;
    }

    .nav-btn:hover::before {
      left: 100%;
    }

    .nav-btn:hover {
      color: #00ff41;
      background: rgba(0, 255, 65, 0.1);
      border-color: #00ff41;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
    }

    .nav-btn.active {
      color: #00ff41;
      background: rgba(0, 255, 65, 0.15);
      border-color: #00ff41;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.5), inset 0 0 20px rgba(0, 255, 65, 0.08);
    }

    .nav-btn.active .nav-icon {
      filter: drop-shadow(0 0 5px #00ff41);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    /* 滚动条样式 */
    .panel-body::-webkit-scrollbar {
      width: 6px;
    }

    .panel-body::-webkit-scrollbar-track {
      background: rgba(0, 255, 65, 0.05);
    }

    .panel-body::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 65, 0.3);
    }

    .panel-body::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 255, 65, 0.5);
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .header h1 {
        font-size: 24px;
        letter-spacing: 4px;
      }

      .hack-buttons {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .hack-btn {
        padding: 20px 12px;
        font-size: 12px;
      }

      .hack-btn .btn-icon {
        font-size: 24px;
      }
    }
  </style>
</head>

  <script>
    // ===== 数字雨效果 =====
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?アイウエオカキクケコサシスセソタチツテトナニヌネノ';
    const charArray = chars.split('');
    const fontSize = 14;
    let columns = canvas.width / fontSize;
    let drops = [];

    function initDrops() {
      columns = Math.floor(canvas.width / fontSize);
      drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
      }
    }
    initDrops();
    window.addEventListener('resize', initDrops);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = charArray[Math.floor(Math.random() * charArray.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        // 头部更亮
        if (y > 0 && y < canvas.height) {
          ctx.fillStyle = '#ffffff';
          ctx.fillText(text, x, y);
          ctx.fillStyle = '#00ff41';
        } else {
          ctx.fillText(text, x, y);
        }

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      requestAnimationFrame(drawMatrix);

    // ===== 通用工具函数 =====

      return `${Math.floor(Math.random()*223)+1}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
    }

    function randomHash(len = 32) {
      const chars = '0123456789abcdef';
      let h = '';
      for (let i = 0; i < len; i++) h += chars[Math.floor(Math.random() * 16)];
      return h;
    }

    function randomMAC() {
      const hex = '0123456789ABCDEF';
      let mac = '';
      for (let i = 0; i < 6; i++) {
        mac += hex[Math.floor(Math.random()*16)] + hex[Math.floor(Math.random()*16)];
        if (i < 5) mac += ':';
      }
      return mac;
    }

    function randomStr(len, chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789') {
      let s = '';
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    function randomHexDump(bytes = 16) {
      let hex = '';
      let ascii = '';
      for (let i = 0; i < bytes; i++) {
        const b = Math.floor(Math.random() * 256);
        hex += b.toString(16).padStart(2, '0') + ' ';
        ascii += (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.';
      }
      return `${hex} |${ascii}|`;
    }

    function pad(s, len, ch = ' ') {
      s = String(s);
      return s.length >= len ? s : s + ch.repeat(len - s.length);
    }

    // 添加一行输出
    function addLine(outputId, text, cls = '') {
      const el = document.getElementById(outputId);

      line.textContent = text;
      el.appendChild(line);

      if (el.children.length > 500) {
        el.removeChild(el.firstChild);
      }
      // 自动滚动
      const body = el.parentElement;
      if (body) body.scrollTop = body.scrollHeight;
    }

    // 启动生成器
    function startGenerator(id, fn, minSec = 180, maxSec = 300) {
      // 如果已有，先停止
      stopGenerator(id);

      const outputId = id + '-output';
      const el = document.getElementById(outputId);
      if (el) el.innerHTML = '';

      const duration = (minSec + Math.random() * (maxSec - minSec)) * 1000;
      const startTime = Date.now();

      generators[id] = {
        active: true,
        timer: null,
        startTime,
        duration,
        phase: 0,
      };

      // 启动生成循环
      function tick() {
        if (!generators[id] || !generators[id].active) return;
        const elapsed = Date.now() - startTime;
        if (elapsed >= duration) {
          // 结束
          addLine(outputId, '', '');
          addLine(outputId, '═══════════════════════════════', 'success');
          addLine(outputId, '  [ 扫描完成 / SCAN COMPLETE ]', 'success');
          addLine(outputId, '═══════════════════════════════', 'success');
          generators[id].active = false;
          return;
        }
        // 调用生成函数
        fn(outputId, generators[id], elapsed, duration);
        // 随机间隔 20~150ms
        const delay = 20 + Math.random() * 130;
        generators[id].timer = setTimeout(tick, delay);
      }
      tick();
    }

    function stopGenerator(id) {
      if (generators[id]) {
        generators[id].active = false;
        if (generators[id].timer) clearTimeout(generators[id].timer);
        generators[id] = null;
      }
